<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Ticket | arx.cr2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Simple Icons CDN for platform logos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-icons-font@v13/font/simple-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(-45deg, #1e3a8a, #0ea5e9, #10b981, #f59e0b, #7c3aed);
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
      min-height: 100vh;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="antialiased flex items-center justify-center p-4">

  <main class="w-full max-w-sm mx-auto my-8">
    
    <!-- Cover Art & Title Section -->
    <div class="text-center mb-6">
      <img 
        src="goldenticket-cover.jpg" 
        alt="Golden Ticket Cover Art" 
        class="w-64 h-64 mx-auto rounded-2xl shadow-2xl object-cover mb-6 border border-white/20"
        onerror="this.src='https://placehold.co/500x500/1e293b/white?text=Golden+Ticket'"
      />
      <h1 class="text-2xl font-extrabold text-white tracking-tight">GOLDEN TICKET</h1>
      <p class="text-white/80 font-medium text-sm mt-1">arx.cr2 • Out Now</p>
    </div>

    <!-- Smart Links Card -->
    <div class="bg-white/90 backdrop-blur-xl rounded-2xl p-3 shadow-2xl divide-y divide-gray-200/60 border border-white/40">
      
      <!-- Spotify -->
      <div class="flex items-center justify-between py-3 px-2">
        <div class="flex items-center space-x-3">
          <i class="si si-spotify text-2xl text-[#1DB954]"></i>
          <span class="font-bold text-gray-800 text-sm">Spotify</span>
        </div>
        <a href="YOUR_SPOTIFY_LINK" target="_blank" class="bg-slate-200/80 hover:bg-slate-300 text-gray-800 font-semibold px-4 py-1.5 rounded-lg text-xs transition-colors">
          Listen
        </a>
      </div>

      <!-- SoundCloud -->
      <div class="flex items-center justify-between py-3 px-2">
        <div class="flex items-center space-x-3">
          <i class="si si-soundcloud text-2xl text-[#FF5500]"></i>
          <span class="font-bold text-gray-800 text-sm">SoundCloud</span>
        </div>
        <a href="https://on.soundcloud.com/CebSMWxtvQeHV45011" target="_blank" class="bg-slate-200/80 hover:bg-slate-300 text-gray-800 font-semibold px-4 py-1.5 rounded-lg text-xs transition-colors">
          Stream
        </a>
      </div>

      <!-- Apple Music -->
      <div class="flex items-center justify-between py-3 px-2">
        <div class="flex items-center space-x-3">
          <i class="si si-apple-music text-2xl text-[#FA243C]"></i>
          <span class="font-bold text-gray-800 text-sm">Apple Music</span>
        </div>
        <a href="YOUR_APPLE_MUSIC_LINK" target="_blank" class="bg-slate-200/80 hover:bg-slate-300 text-gray-800 font-semibold px-4 py-1.5 rounded-lg text-xs transition-colors">
          Listen
        </a>
      </div>

      <!-- YouTube Music -->
      <div class="flex items-center justify-between py-3 px-2">
        <div class="flex items-center space-x-3">
          <i class="si si-youtubemusic text-2xl text-[#FF0000]"></i>
          <span class="font-bold text-gray-800 text-sm">YouTube Music</span>
        </div>
        <a href="YOUR_YOUTUBE_LINK" target="_blank" class="bg-slate-200/80 hover:bg-slate-300 text-gray-800 font-semibold px-4 py-1.5 rounded-lg text-xs transition-colors">
          Play
        </a>
      </div>

      <!-- Amazon Music -->
      <div class="flex items-center justify-between py-3 px-2">
        <div class="flex items-center space-x-3">
          <i class="si si-amazonmusic text-2xl text-[#00A8E1]"></i>
          <span class="font-bold text-gray-800 text-sm">Amazon Music</span>
        </div>
        <a href="YOUR_AMAZON_LINK" target="_blank" class="bg-slate-200/80 hover:bg-slate-300 text-gray-800 font-semibold px-4 py-1.5 rounded-lg text-xs transition-colors">
          Stream
        </a>
      </div>

    </div>

  </main>

</body>
</html>
