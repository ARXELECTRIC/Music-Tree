<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Ticket | Biscuit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      /* Icy gradient palette: Deep Indigo -> Glacier Blue -> Ice Cyan -> Bright Frost */
      background: linear-gradient(-45deg, #0284c7, #0f172a, #38bdf8, #1e3a8a, #bae6fd);
      background-size: 400% 400%;
      /* Smooth 8-second gradient transition */
      animation: iceGradient 8s ease infinite;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes iceGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Base Snowflake Styles */
    .snowflake {
      position: absolute;
      top: -20px;
      color: rgba(255, 255, 255, 0.9);
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) translateX(0) rotate(0deg);
        opacity: 0.9;
      }
      50% {
        transform: translateY(50vh) translateX(30px) rotate(180deg);
      }
      100% {
        transform: translateY(105vh) translateX(-20px) rotate(360deg);
        opacity: 0.1;
      }
    }

    /* Snowflakes - Varied Sizes, Speeds, Delays, & Positions */
    .s1  { left: 5%;  font-size: 0.7rem; animation-duration: 9s;  animation-delay: 0s;   opacity: 0.6; }
    .s2  { left: 12%; font-size: 1.8rem; animation-duration: 6s;  animation-delay: 1.2s; filter: blur(1px); }
    .s3  { left: 20%; font-size: 0.9rem; animation-duration: 11s; animation-delay: 2.5s; opacity: 0.8; }
    .s4  { left: 28%; font-size: 2.2rem; animation-duration: 7s;  animation-delay: 0.5s; filter: blur(1.5px); }
    .s5  { left: 35%; font-size: 0.6rem; animation-duration: 10s; animation-delay: 3s;   opacity: 0.5; }
    .s6  { left: 42%; font-size: 1.4rem; animation-duration: 8s;  animation-delay: 1.8s; }
    .s7  { left: 50%; font-size: 0.8rem; animation-duration: 12s; animation-delay: 0.2s; opacity: 0.7; }
    .s8  { left: 58%; font-size: 2.0rem; animation-duration: 6.5s;animation-delay: 2.2s; filter: blur(1px); }
    .s9  { left: 65%; font-size: 1.1rem; animation-duration: 9.5s;animation-delay: 1s;   }
    .s10 { left: 73%; font-size: 0.5rem; animation-duration: 13s; animation-delay: 4s;   opacity: 0.4; }
    .s11 { left: 80%; font-size: 1.6rem; animation-duration: 7.5s;animation-delay: 0.8s; }
    .s12 { left: 88%; font-size: 2.5rem; animation-duration: 5.5s;animation-delay: 3.2s; filter: blur(2px); }
    .s13 { left: 94%; font-size: 0.9rem; animation-duration: 10s; animation-delay: 1.5s; opacity: 0.8; }
    .s14 { left: 15%; font-size: 1.3rem; animation-duration: 8.5s;animation-delay: 4.5s; }
    .s15 { left: 48%; font-size: 2.1rem; animation-duration: 6.2s;animation-delay: 3.8s; filter: blur(1px); }
    .s16 { left: 83%; font-size: 0.7rem; animation-duration: 11.5s;animation-delay: 2s;  opacity: 0.6; }
  </style>
</head>
<body class="antialiased flex items-center justify-center p-4">

  <!-- Background Snow Layer (Multiple Sizes & Layers) -->
  <div class="snowflake s1">❄</div>

  <div class="snowflake s3">❆</div>
  <div class="snowflake s4">❄</div>
  <div class="snowflake s5">•</div>
  <div class="snowflake s6">❅</div>

    </div>

  </main>
